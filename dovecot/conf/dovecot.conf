mail_location = maildir:/var/mail/%u:INDEX=/var/mail-indexes/%u
mail_privileged_group = mail
protocols = imap

# Matches Hostinger's folder naming ("INBOX.Sent", "INBOX.Trash", etc.)
# exactly, so the sync daemon can use ONE folder name per mailbox instead
# of a local<->remote mapping table. This only changes the name Dovecot
# exposes over IMAP -- Maildir++ still stores each folder on disk as
# ".Sent", ".Trash" etc, so this is safe to add even with mail already
# synced; nothing on disk needs to move.
namespace inbox {
  type = private
  inbox = yes
  prefix = INBOX.
  separator = .
  list = yes
}

mmap_disable = no
mail_fsync = optimized
mail_nfs_storage = no

passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}

ssl = no
disable_plaintext_auth = no

log_path = /dev/stderr
info_log_path = /dev/stderr
debug_log_path = /dev/stderr
mail_debug = no
auth_debug = no